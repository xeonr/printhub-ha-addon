name: Print Hub worker
# Set by Print Hub's pipeline when it publishes new images (the image tag).
version: "1.0.126"
slug: printhub_worker
description: Lets Print Hub reach the 3D printers on your home network.
url: https://github.com/xeonr/printhub-ha-addon
arch:
  - aarch64
  - amd64
  - armv7
# Prebuilt, from Print Hub's pipeline: ghcr.io/xeonr/aarch64-printhub-worker:<version>, …
image: ghcr.io/xeonr/{arch}-printhub-worker
# A single Go program: it handles its own signals, no init or s6.
init: false
startup: application
boot: auto
# Print Hub in the sidebar, through the worker (sign in by code); the
# worker's own settings (pairing, Unlink) at _worker/ within it.
ingress: true
ingress_port: 8099
panel_icon: mdi:printer-3d-nozzle
panel_title: Print Hub
options:
  hub: https://printhub.xeonr.io
  name: Home Assistant
  sidebar: true
schema:
  hub: url
  name: str
  allow: str?
  sidebar: bool
